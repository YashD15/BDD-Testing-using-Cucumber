spring.application.name=wallet

# H2 database file stored in the project directory
# FOR PERSISTENT DATA USE BELOW
spring.datasource.url=jdbc:h2:file:./database/walletdb

# FOR TEST ONYL USE BELOW
# spring.datasource.url=jdbc:h2:mem:wallettest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep the schema/data across application restarts
# FOR PERSISTENT DATA USE BELOW
spring.jpa.hibernate.ddl-auto=update

# FOR TEST ONYL USE BELOW
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Optional local-only database console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console